<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percival Rev C</title><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans,system-ui)}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;font-size:13px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius,8px);background:var(--secondary);color:var(--foreground);cursor:pointer}button[aria-selected="true"]{background:var(--primary);color:var(--primary-foreground)}figure{display:none;margin:0}figure.active{display:block}img{display:block;width:100%;height:650px;object-fit:contain;border-radius:var(--radius,12px)}figcaption{color:var(--muted-foreground);font-size:13px;line-height:1.6;margin-top:12px}.note{font-size:13px;line-height:1.6;color:var(--muted-foreground);margin:12px 0 0}@media(max-width:480px){img{height:470px}button{padding:7px 10px}}
</style></head><body><nav role="tablist" aria-label="Rev C design views"><button role="tab" aria-selected="true" data-view="hero">Character</button><button role="tab" aria-selected="false" data-view="front">Front</button><button role="tab" aria-selected="false" data-view="side">Side</button><button role="tab" aria-selected="false" data-view="head">Head detail</button></nav>
<figure id="hero" class="active"><img src="renders/rev-c/percival-rev-c-hero.png" alt="Cream and purple robot with a tilted binocular head, asymmetric ears, compact torso, small raised greeting hand, bent chunky legs and broad boots"><figcaption>Rev C · Compact industrial character. Broad chamfers, separate armour panels, recessed socket screws and restrained orange service details.</figcaption></figure>
<figure id="front"><img src="renders/rev-c/percival-rev-c-front.png" alt="Front view showing big legs and compact torso"><figcaption>Front · Wider leg armour, a 62 mm torso, compact arms and a larger head. The tilted face and little greeting hand keep the character friendly.</figcaption></figure>
<figure id="side"><img src="renders/rev-c/percival-rev-c-side.png" alt="Side view showing flexed knees, large feet and compact battery backpack"><figcaption>Side · Bent legs, broad boots and a compact rear pack. This is an illustrative pose; balance and walking have not been validated.</figcaption></figure>
<figure id="head"><img src="renders/rev-c/percival-rev-c-head.png" alt="Close-up of the robot's unequal binocular eyes, small raised gripper and asymmetric ears"><figcaption>Head detail · Clipped corners, cheek armour, crown access hatch and visible screw recesses. The gentle head gesture remains on frames 1–73.</figcaption></figure>
<p class="note">About 541 mm tall — 33 mm shorter than Rev B. The head gesture stays below 546 mm. Concept geometry requires mechanical and print validation. Your approved Rev B is saved separately.</p>
<script>document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));document.querySelectorAll('figure').forEach(f=>f.classList.toggle('active',f.id===b.dataset.view));}));</script></body></html>
