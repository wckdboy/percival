<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percival Rev D</title><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans,system-ui)}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;font-size:13px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius,8px);background:var(--secondary);color:var(--foreground);cursor:pointer}button[aria-selected="true"]{background:var(--primary);color:var(--primary-foreground)}figure{display:none;margin:0}figure.active{display:block}img{display:block;width:100%;height:650px;object-fit:contain;border-radius:var(--radius,12px)}figcaption{color:var(--muted-foreground);font-size:13px;line-height:1.6;margin-top:12px}.note{font-size:13px;line-height:1.6;color:var(--muted-foreground);margin:12px 0 0}@media(max-width:480px){img{height:470px}button{padding:7px 10px}}
</style></head><body><nav role="tablist" aria-label="Rev D design views"><button role="tab" aria-selected="true" data-view="hero">Character</button><button role="tab" aria-selected="false" data-view="front">Front</button><button role="tab" aria-selected="false" data-view="side">Side</button><button role="tab" aria-selected="false" data-view="top">Top</button><button role="tab" aria-selected="false" data-view="head">Head detail</button><button role="tab" aria-selected="false" data-view="reference">Reference</button></nav>
<figure id="hero" class="active"><img src="renders/rev-d/percival-rev-d-hero.png" alt="Cream and purple robot with tapered torso and pelvis, short articulated legs, a broad sensor head and a small greeting hand"><figcaption>Rev D · Reference-led proportions: lower hips, tapered chest and pelvis, shorter sculpted legs, smaller recessed optics and a central sensor capsule.</figcaption></figure>
<figure id="front"><img src="renders/rev-d/percival-rev-d-front.png" alt="Front view showing big legs and compact torso"><figcaption>Front · A taller, narrower chest and distinct pelvis replace the compressed torso. Shorter leg links retain large joint discs and shaped armour.</figcaption></figure>
<figure id="side"><img src="renders/rev-d/percival-rev-d-side.png" alt="Side view showing flexed knees, large feet and compact battery backpack"><figcaption>Side · Sloping insteps, slimmer forearms, a neck gimbal and rounded rear head profile follow the supplied side view. Pose remains illustrative.</figcaption></figure>
<figure id="head"><img src="renders/rev-d/percival-rev-d-head.png" alt="Close-up of the robot's unequal binocular eyes, small raised gripper and asymmetric ears"><figcaption>Head detail · Smaller dark optics, a central sensor capsule, a thicker ivory bezel, purple side housings and a slim antenna. Frames 1–73 retain the idle head gesture.</figcaption></figure>
<figure id="top"><img src="renders/rev-d/percival-rev-d-top.png" alt="Top view showing the deep tapered head shell, crown hatch, antenna and rear pack"><figcaption>Top · Broad shell, purple access hatch, side pods and rear battery pack.</figcaption></figure><figure id="reference"><img src="reference/design-images/reference-front.png" alt="User supplied front reference robot"><figcaption>Your supplied front reference. It guides the silhouette and relative proportions; it is not a dimensional engineering drawing.</figcaption></figure><p class="note">About 547 mm tall; the idle gesture stays below 550 mm. Proportions are visual estimates from your references. Your approved Rev C is saved separately. Physical fit, print construction and walking remain unverified.</p>
<script>document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));document.querySelectorAll('figure').forEach(f=>f.classList.toggle('active',f.id===b.dataset.view));}));</script></body></html>
